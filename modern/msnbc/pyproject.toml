[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msnbc-modern"
version = "0.1.0"
description = "Modernized MSNBC network analysis pipeline"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=9.0"]
graph = ["networkx>=3.0"]

[project.scripts]
msnbc-modern = "msnbc_modern.pipeline:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
